<style>
/* Layout: left rail of departments-style navigation, working surface on the right; stacks to a top tab strip on phones. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#eaeef0; --line:#d7dde1;
  --fg:#17232b; --fg-2:#4d5d68; --fg-3:#7a8a95;
  --accent:#0b6b62; --accent-ink:#ffffff; --accent-soft:#d9efec;
  --gold:#b7791f; --gold-soft:#f8ecd6;
  --red:#b42318; --red-soft:#fde4e1; --amber:#a15c07; --amber-soft:#fdf0d5;
  --green:#1d7a3e; --green-soft:#ddf3e4; --blue:#1f5fa8; --blue-soft:#e0ebf8;
  --shadow:0 1px 2px rgba(18,35,43,.06),0 4px 16px rgba(18,35,43,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1619; --surface:#162026; --surface-2:#1d2a31; --line:#2b3a42;
  --fg:#e6edf0; --fg-2:#a9b8c0; --fg-3:#7d8e98;
  --accent:#3fb8a9; --accent-ink:#06211e; --accent-soft:#163a37;
  --gold:#e3a94f; --gold-soft:#3a2d17;
  --red:#ff8a7e; --red-soft:#3d1c19; --amber:#f0b34f; --amber-soft:#3a2b12;
  --green:#6fd394; --green-soft:#16321f; --blue:#86b6ef; --blue-soft:#172a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1619; --surface:#162026; --surface-2:#1d2a31; --line:#2b3a42;
  --fg:#e6edf0; --fg-2:#a9b8c0; --fg-3:#7d8e98;
  --accent:#3fb8a9; --accent-ink:#06211e; --accent-soft:#163a37;
  --gold:#e3a94f; --gold-soft:#3a2d17;
  --red:#ff8a7e; --red-soft:#3d1c19; --amber:#f0b34f; --amber-soft:#3a2b12;
  --green:#6fd394; --green-soft:#16321f; --blue:#86b6ef; --blue-soft:#172a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.92rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.brand b{font-family:var(--f-display);font-size:.98rem;display:block}
.brand small{color:var(--fg-3);font-size:.72rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--fg-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.badge{font-family:var(--f-mono);font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--red-soft);color:var(--red)}
.rail-foot{margin-top:auto;font-size:.75rem;color:var(--fg-3);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.main{padding-block:20px 60px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.topbar .who{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;min-width:0}
.topbar .who select{max-width:260px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--fg-2);font-weight:500;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head p{margin:2px 0 0;color:var(--fg-3);font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.75rem;color:var(--fg-2)}
.kpi.warn{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.filters label.f{width:auto;flex:1 1 140px;max-width:220px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:.78rem;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.grid2 .row{grid-template-columns:auto minmax(0,1fr)}.grid2 .row .acts{grid-column:2;justify-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.p-urgent{background:var(--red-soft);color:var(--red)}
.p-high{background:var(--amber-soft);color:var(--amber)}
.p-normal{background:var(--blue-soft);color:var(--blue)}
.p-low{background:var(--surface-2);color:var(--fg-2)}
.s-done,.ok{background:var(--green-soft);color:var(--green)}
.s-progress{background:var(--blue-soft);color:var(--blue)}
.s-blocked,.bad{background:var(--red-soft);color:var(--red)}
.s-todo,.muted{background:var(--surface-2);color:var(--fg-2)}
.warnc{background:var(--amber-soft);color:var(--amber)}
.goldc{background:var(--gold-soft);color:var(--gold)}
.pbar{width:6px;align-self:stretch;border-radius:3px}
.pbar.urgent{background:var(--red)}.pbar.high{background:var(--amber)}.pbar.normal{background:var(--blue)}.pbar.low{background:var(--line)}
.missed-tag{color:var(--red);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--fg-3);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score{display:flex;align-items:center;gap:8px;min-width:120px}
.score .track{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.score .fill{height:100%;border-radius:3px}
.note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.8rem;color:var(--fg-2)}
.banner{border-radius:8px;padding:10px 14px;font-size:.85rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--gold-soft);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%}
.seg button{white-space:nowrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:.82rem;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,20,25,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.dlg-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-body{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dlg-body .full{grid-column:1/-1}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:.85rem}
.kv dt{color:var(--fg-3)}.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.85rem;z-index:50;max-width:calc(100vw - 32px)}
.mini{font-size:.78rem;color:var(--fg-3)}
.stack{display:flex;flex-direction:column;gap:16px}
.sec-title{display:flex;align-items:center;gap:8px}
.cnt{font-family:var(--f-mono);font-size:.75rem;color:var(--fg-3)}
.checklist{margin:0;padding-left:18px;font-size:.85rem}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{min-width:0}.topbar .who{width:100%}.topbar .who label.f{flex:1 1 160px}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap}
  .rail-foot{display:none}
  .main{padding-inline:16px}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dlg-body{grid-template-columns:1fr}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .acts{grid-column:2;justify-content:flex-start}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:40;overflow:auto}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.auth-err{color:var(--red);font-size:.85rem;min-height:1.2em}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>

<div id="auth" hidden></div>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark">OD</div><div><b>Clinic Ops Desk</b><small>Head office · Dubai</small></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>

<script>
/* ---------- constants ---------- */
const TZ='Asia/Dubai';
const DEPTS=['Operations','Clinic Manager','HR','Accounts','Marketing','Insurance','Aesthetic Coordinator','Dental Coordinator','Reception Desk Supervisor','Customer Relations'];
const PRI=[['urgent','Urgent',4],['high','High',3],['normal','Normal',2],['low','Low',1]];
const PRIW=Object.fromEntries(PRI.map(p=>[p[0],p[2]]));
const PRIL=Object.fromEntries(PRI.map(p=>[p[0],p[1]]));
const STATUS=[['todo','To do'],['progress','In progress'],['blocked','Blocked'],['done','Done']];
const STATUSL=Object.fromEntries(STATUS);
const ROLES=[['staff','Staff'],['manager','Clinic manager'],['admin','MD']];
const ROLEL=Object.fromEntries(ROLES);
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const REC=[['none','One-off'],['daily','Every day'],['weekly','Every week'],['monthly','Every month']];
const CSTAT=[['new','New'],['investigating','Investigating'],['resolved','Resolved'],['closed','Closed']];
const CSTATL=Object.fromEntries(CSTAT);
const SEV=[['critical','Critical',4],['high','High',24],['medium','Medium',48],['low','Low',72]];
const SEVL=Object.fromEntries(SEV.map(s=>[s[0],s[1]]));
const SEVH=Object.fromEntries(SEV.map(s=>[s[0],s[2]]));
const CCATS=['Waiting time','Staff behaviour','Treatment outcome','Billing / pricing','Insurance / claim','Appointment / booking','Facility / hygiene','Other'];
const CHANNELS=['Walk-in','Phone','WhatsApp','Email','Google review','Social media'];
const COLS=['clinics','staff','tasks','reports','complaints','requests'];
const RTYPES=['Leave','Purchase / expense','Patient discount / refund','Overtime','Schedule / shift change','Insurance write-off','Marketing spend','Other'];
const RSTAT={pending:['Waiting for manager','warnc'],recommended:['Recommended · awaiting MD','s-progress'],not_recommended:['Not recommended · awaiting MD','bad'],approved:['Approved','ok'],rejected:['Rejected','bad']};

/* ---------- time (Dubai) ---------- */
const dtf=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function dubai(d=new Date()){const p=Object.fromEntries(dtf.formatToParts(d).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`}}
const today=()=>dubai().date;
const nowKey=()=>{const d=dubai();return d.date+'T'+d.time};
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function addMonths(s,n){const d=new Date(s+'T00:00:00Z');const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return d.toISOString().slice(0,10)}
const weekday=s=>new Date(s+'T00:00:00Z').getUTCDay();
function fmtDate(s){if(!s)return'—';const d=new Date(s+'T00:00:00Z');const t=today();if(s===t)return'Today';if(s===addDays(t,-1))return'Yesterday';if(s===addDays(t,1))return'Tomorrow';return d.toLocaleDateString('en-GB',{timeZone:'UTC',day:'numeric',month:'short'})}
function hoursSince(iso){return(Date.now()-new Date(iso).getTime())/36e5}
function ago(iso){const h=hoursSince(iso);if(h<1)return Math.max(1,Math.round(h*60))+'m';if(h<48)return Math.round(h)+'h';return Math.round(h/24)+'d'}

/* ---------- utils ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const opts=(arr,sel,blank)=>(blank!==undefined?`<option value="">${esc(blank)}</option>`:'')+arr.map(a=>{const[v,l]=Array.isArray(a)?a:[a,a];return`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`}).join('');
const pct=x=>x==null||isNaN(x)?'—':Math.round(x*100)+'%';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- store: shared db when available, this-device storage otherwise ---------- */
const S={clinics:{},staff:{},tasks:{},reports:{},complaints:{},requests:{}};
let mode='connecting',db=null,adminOK=true;const chains={};
function clean(o){return JSON.parse(JSON.stringify(o))}
function saveLocal(){lsSet('cod.data',S)}
function errMsg(e){if(e&&e.code==='quota_exceeded')return'Storage is full. Remove old sample data or closed items.';if(e&&e.code==='invalid_argument')return'You have view-only access, so changes are not saved.';return'Could not save. Check your connection and try again.'}
const SB_URL='https://oxucnacsnkdxdprzudhx.supabase.co',SB_KEY='sb_publishable_XhBp3WjCgxvOQ12bx4Yg9A_oi_-cvwx',LOGIN_DOMAIN='staff.clinicopsdesk.app';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let PROFILE=null,PROFILES={},channel=null;
function saveErr(e){const m=e&&e.message||'';if(/row-level security/i.test(m))return'You do not have permission to change this.';if(/JWT|session/i.test(m))return'Your session expired. Sign in again.';return m||'Could not save. Check your connection.'}
function put(col,id,obj){obj=clean(obj);const prev=S[col][id];S[col]={...S[col],[id]:obj};schedule();
  const k=col+'/'+id;chains[k]=(chains[k]||Promise.resolve()).then(async()=>{const{error}=await sb.from('docs').upsert({col,id,data:obj});
    if(error){toast(saveErr(error));const c={...S[col]};if(prev)c[id]=prev;else delete c[id];S[col]=c;schedule()}});return chains[k]}
function del(col,id){const prev=S[col][id];const c={...S[col]};delete c[id];S[col]=c;schedule();
  const k=col+'/'+id;chains[k]=(chains[k]||Promise.resolve()).then(async()=>{const{error,count}=await sb.from('docs').delete({count:'exact'}).eq('col',col).eq('id',id);
    if(error||count===0){toast(error?saveErr(error):'You do not have permission to delete this.');if(prev)S[col]={...S[col],[id]:prev};schedule()}});return chains[k]}
async function loadAll(){const all=[];for(let from=0;;from+=1000){const{data,error}=await sb.from('docs').select('col,id,data').order('col').order('id').range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break}
  const N={};COLS.forEach(c=>N[c]={});all.forEach(r=>{if(N[r.col])N[r.col][r.id]=r.data});Object.assign(S,N)}
async function loadProfiles(){const{data}=await sb.from('profiles').select('user_id,username,staff_id,role');PROFILES={};(data||[]).forEach(p=>{PROFILES[p.user_id]=p})}
const loginOf=sid=>Object.values(PROFILES).find(p=>p.staff_id===sid);
async function callFn(body){const{data,error}=await sb.functions.invoke('staff-login',{body});if(error){let m='Request failed. Try again.';try{m=(await error.context.json()).error||m}catch{}throw new Error(m)}return data}
const toEmail=u=>{u=u.trim().toLowerCase();return u.includes('@')?u:`${u}@${LOGIN_DOMAIN}`};
async function boot(){
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch{}
  if(session)return startSession(session);
  showAuth()}

async function startSession(session){
  const{data:p}=await sb.from('profiles').select('user_id,username,staff_id,role').eq('user_id',session.user.id).maybeSingle();
  if(!p){await sb.auth.signOut();return showAuth('This login has no access. Ask the MD.')}
  PROFILE=p;adminOK=p.role==='admin';if(!adminOK){UI.actingAs=p.staff_id||'';UI.clinic=''}
  document.getElementById('auth').hidden=true;document.getElementById('main').innerHTML='<div class="empty">Loading your workspace…</div>';
  try{await Promise.all([loadAll(),loadProfiles()])}catch(e){toast('Could not load data. Check your connection.')}
  if(!adminOK){const st=S.staff[p.staff_id];if(st&&p.role==='manager')UI.clinic=st.clinicId}
  mode='shared';
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{
    if(pl.eventType==='DELETE'){const o=pl.old||{};if(S[o.col]&&S[o.col][o.id]){const c={...S[o.col]};delete c[o.id];S[o.col]=c}}
    else{const n=pl.new;if(n&&S[n.col])S[n.col]={...S[n.col],[n.id]:n.data}}schedule()})
   .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>loadProfiles().then(()=>{const p2=PROFILES[PROFILE.user_id];if(!p2)return signOut();PROFILE=p2;adminOK=p2.role==='admin';schedule()}))
   .subscribe();
  schedule()}

const dueKey=t=>t.dueDate+'T'+(t.dueTime||'23:59');
const isOpen=t=>t.status!=='done';
const isOverdue=t=>isOpen(t)&&t.dueDate&&dueKey(t)<nowKey();
const isMissed=t=>isOpen(t)&&t.dueDate&&t.dueDate<today();
function inClinic(x){return!UI.clinic||x.clinicId===UI.clinic}
function taskSort(a,b){const ma=isMissed(a)?1:0,mb=isMissed(b)?1:0;if(ma!==mb)return mb-ma;const pa=PRIW[a.priority]||0,pb=PRIW[b.priority]||0;if(pa!==pb)return pb-pa;return(dueKey(a)).localeCompare(dueKey(b))}
function managerOf(clinicId){return staffArr().find(s=>s.clinicId===clinicId&&s.role==='manager')}
function worksOn(s,date){return s.active!==false&&(s.dayOff==null||s.dayOff===''||+s.dayOff!==weekday(date))&&(!s.startDate||date>=s.startDate)}
function reportFor(sid,date){return S.reports[date+'_'+sid]}

function carryOver(t){const old=t.dueDate;const nt={...t};delete nt.id;nt.originalDue=t.originalDue||old;nt.carryCount=(t.carryCount||0)+1;nt.dueDate=today();
  nt.history=[...(t.history||[]),{at:new Date().toISOString(),by:me()?.name||'MD',what:`Carried over from ${old}`}].slice(-20);return put('tasks',t.id,nt)}
function setStatus(t,st){const nt={...t};delete nt.id;nt.status=st;
  nt.history=[...(t.history||[]),{at:new Date().toISOString(),by:me()?.name||'MD',what:'Status: '+STATUSL[st]}].slice(-20);
  if(st==='done'){nt.completedAt=new Date().toISOString();nt.completedLocal=nowKey();nt.verify='pending';delete nt.verifiedBy;delete nt.verifiedAt;
    if(t.recurrence&&t.recurrence!=='none'&&!t.nextCreated){nt.nextCreated=true;const base=t.dueDate||today();
      let nd=t.recurrence==='daily'?addDays(base,1):t.recurrence==='weekly'?addDays(base,7):addMonths(base,1);if(nd<today())nd=today();
      const n={title:t.title,notes:t.notes||'',clinicId:t.clinicId,dept:t.dept,assigneeId:t.assigneeId,priority:t.priority,dueDate:nd,dueTime:t.dueTime||'',recurrence:t.recurrence,status:'todo',createdAt:new Date().toISOString(),createdBy:t.createdBy||'',carryCount:0,sample:t.sample||undefined,history:[]};
      put('tasks',uid(),n)}}
  else{delete nt.completedAt;delete nt.completedLocal;if(nt.verify!=='returned')delete nt.verify}
  return put('tasks',t.id,nt)}

/* ---------- efficiency ---------- */
function calc(days,groupKey){
  const end=today(),start=addDays(end,-(days-1));const nk=nowKey();
  const groups={};const g=k=>groups[k]||(groups[k]={assigned:0,done:0,onTime:0,missed:0,hrs:[],expected:0,submitted:0,late:0});
  taskArr().forEach(t=>{const d=t.originalDue||t.dueDate;if(!d||d<start||d>end)return;if(!inClinic(t))return;
    const k=groupKey==='dept'?t.dept:t.assigneeId;if(!k)return;const x=g(k);x.assigned++;
    if(t.status==='done'){x.done++;const deadline=d+'T'+(t.dueTime||'23:59');if((t.completedLocal||'')<=deadline)x.onTime++;if(t.createdAt&&t.completedAt)x.hrs.push((new Date(t.completedAt)-new Date(t.createdAt))/36e5)}
    if((t.carryCount||0)>0||isOverdue(t))x.missed++});
  staffArr().forEach(s=>{if(!inClinic(s))return;const k=groupKey==='dept'?s.dept:s.id;const x=g(k);
    for(let d=start;d<=end;d=addDays(d,1)){if(!worksOn(s,d))continue;const r=reportFor(s.id,d);
      if(d===end&&!r&&dubai().time<(s.shiftEnd||'18:00'))continue;x.expected++;if(r){x.submitted++;if(r.late)x.late++}}});
  Object.values(groups).forEach(x=>{x.compRate=x.assigned?x.done/x.assigned:null;x.onTimeRate=x.assigned?x.onTime/x.assigned:null;x.repRate=x.expected?x.submitted/x.expected:null;
    x.avgHrs=x.hrs.length?x.hrs.reduce((a,b)=>a+b,0)/x.hrs.length:null;
    if(x.assigned&&x.expected)x.score=Math.round(100*(.5*x.onTimeRate+.3*x.compRate+.2*x.repRate));
    else if(x.assigned)x.score=Math.round(100*(.625*x.onTimeRate+.375*x.compRate));
    else if(x.expected)x.score=Math.round(100*x.repRate);else x.score=null});
  return groups}
function grade(s){if(s==null)return['No data','muted'];if(s>=85)return['Excellent','ok'];if(s>=70)return['Good','s-progress'];if(s>=50)return['Needs attention','warnc'];return['Poor','bad']}
function scoreCell(s){const[l,c]=grade(s);const col=s==null?'var(--line)':s>=85?'var(--green)':s>=70?'var(--blue)':s>=50?'var(--amber)':'var(--red)';
  return`<div class="score"><span class="num" style="width:2.2em;text-align:right">${s==null?'—':s}</span><div class="track"><div class="fill" style="width:${s||0}%;background:${col}"></div></div><span class="chip ${c}">${l}</span></div>`}

function taskRow(t,o={}){
  const missed=isMissed(t),over=isOverdue(t);
  const due=t.dueDate?`${fmtDate(t.dueDate)}${t.dueTime?' '+t.dueTime:''}`:'No due date';
  const acts=o.verify?`<button class="btn sm primary" data-act="verifyTask" data-id="${t.id}">Verify</button><button class="btn sm" data-act="returnTask" data-id="${t.id}">Return with note</button>`:o.compact?'':t.status==='done'?`<button class="btn sm" data-act="reopen" data-id="${t.id}">Reopen</button>`:
   `${missed?`<button class="btn sm" data-act="carry" data-id="${t.id}">Carry to today</button>`:''}${t.status==='todo'?`<button class="btn sm" data-act="start" data-id="${t.id}">Start</button>`:''}<button class="btn sm primary" data-act="done" data-id="${t.id}">Done</button>`;
  return`<div class="row"><div class="pbar ${t.priority}" title="${PRIL[t.priority]} priority"></div>

   ${t.status==='done'?(t.verify==='verified'?`<span class="chip ok" title="${esc(t.verifiedBy||'')}">Verified${t.verifiedRole?' · '+esc(t.verifiedRole):''}</span>`:'<span class="chip muted">Awaiting verification</span>'):''}

   ${t.carryCount?`<span class="chip goldc" title="Originally due ${esc(t.originalDue)}">Carried ×${t.carryCount}</span>`:''}
   ${o.noWho?'':`<span>${esc(staffName(t.assigneeId))}</span>`}<span>${esc(t.dept||'')}</span><span>${esc(clinicName(t.clinicId))}</span>

  const open=T.filter(isOpen),missed=T.filter(isMissed).sort(taskSort),dueToday=open.filter(t=>t.dueDate===td),doneToday=T.filter(t=>t.status==='done'&&(t.completedLocal||'').startsWith(td));

function vMyDay(){
  const m=me();
  if(!m||!m.name)return`<div class="empty"><h2>Choose who you are</h2><p>Use “View as” at the top to see any employee’s day.</p></div>`;
  const td=today(),mine=taskArr().filter(t=>t.assigneeId===m.id);
  const missed=mine.filter(isMissed).sort(taskSort),todayT=mine.filter(t=>isOpen(t)&&t.dueDate===td).sort(taskSort);
  const upcoming=mine.filter(t=>isOpen(t)&&t.dueDate>td&&t.dueDate<=addDays(td,7)).sort(taskSort),doneT=mine.filter(t=>t.status==='done'&&(t.completedLocal||'').startsWith(td));
  const r=reportFor(m.id,td);const mgr=managerOf(m.clinicId);

function vEfficiency(){
  if(!Object.keys(S.staff).length)return emptySetup();

  const keys=by==='dept'?DEPTS:staffArr().filter(inClinic).map(s=>s.id);
  const rows=keys.map(k=>({k,x:G[k]||null})).sort((a,b)=>((b.x?.score??-1)-(a.x?.score??-1)));
  return`<section class="panel"><div class="panel-head"><div class="seg" role="group" aria-label="Group by">${[['staff','By employee'],['dept','By department']].map(([k,l])=>`<button data-act="effBy" data-v="${k}" aria-pressed="${by===k}">${l}</button>`).join('')}</div>
   <div class="seg" role="group" aria-label="Period">${[7,30,90].map(n=>`<button data-act="effDays" data-v="${n}" aria-pressed="${days===n}">${n} days</button>`).join('')}</div></div>
   <div class="tbl-wrap"><table><thead><tr><th>${by==='dept'?'Department':'Employee'}</th><th class="n">Tasks</th><th class="n">Done</th><th class="n">On time</th><th class="n">Missed</th><th class="n">Avg hrs</th><th class="n">Reports</th><th>Score</th></tr></thead><tbody>
   ${rows.map(({k,x})=>{const s=S.staff[k];const name=by==='dept'?esc(k):`<b>${esc(s.name)}</b><div class="mini">${esc(s.dept)} · ${esc(clinicName(s.clinicId))}</div>`;
     return`<tr><td>${name}</td><td class="n">${x?x.assigned:0}</td><td class="n">${x?x.done:0}</td><td class="n">${pct(x?.onTimeRate)}</td><td class="n">${x?x.missed:0}</td><td class="n">${x?.avgHrs!=null?x.avgHrs.toFixed(1):'—'}</td><td class="n">${x&&x.expected?`${x.submitted}/${x.expected}`:'—'}</td><td>${scoreCell(x?.score??null)}</td></tr>`}).join('')}</tbody></table></div>
   <div class="note"><b>How the score works.</b> Tasks count in the period by their original due date. <b>On time</b> means marked done before the first due time; a carried-over task never counts as on time. <b>Done</b> is the share completed at all. <b>Reports</b> is end-of-shift reports filed on working days (weekly day off excluded). Score = 50% on-time + 30% completion + 20% reports. 85+ Excellent, 70–84 Good, 50–69 Needs attention, below 50 Poor.</div></section>`}

const reqArr=()=>Object.entries(S.requests).map(([id,r])=>({id,...r}));
const waiting=r=>r.status==='pending'||r.status==='recommended'||r.status==='not_recommended';

function decideForm(id){const r=S.requests[id];if(!r)return;const role=myRole(),act=canAct({id,...r});const kv=(k,v)=>v||v===0?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';

function activity(who,days){const since=addDays(today(),-days),E=[];
  taskArr().forEach(t=>{if(!inClinic(t)||(who&&t.assigneeId!==who))return;if(t.completedAt&&(t.completedLocal||'')>=since)E.push({at:t.completedAt,who:t.assigneeId,kind:'Task completed',k:'s-done',text:t.title,extra:t.verify==='verified'?'<span class="chip ok">Verified</span>':'<span class="chip muted">Awaiting verification</span>',act:t.verify!=='verified'&&(myRole()==='admin'||(myRole()==='manager'&&t.assigneeId!==me()?.id))?`<button class="btn sm" data-act="verifyTask" data-id="${t.id}">Verify</button>`:''})});

const dlg=document.getElementById('dlg'),dlgForm=document.getElementById('dlgForm');let onSubmit=null;
function modal(title,body,submit,o={}){
  dlgForm.innerHTML=`<div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="btn sm ghost" data-act="closeDlg" aria-label="Close">✕</button></div><div class="dlg-body">${body}</div>

  // completed history over the last 3 weeks

    P('tasks',uid()+'h',{title:['Daily settlement','Claims batch','Lab confirmations','Opening checklist','Social post','Lead call-backs','Attendance check'][j],clinicId:ids[s[2]],dept:s[1],assigneeId:sid[p],priority:j%3===0?'high':'normal',dueDate:date,dueTime:'17:00',recurrence:'none',status:'done',createdAt:new Date(now-864e5*(d+1)).toISOString(),completedAt:new Date(now-864e5*d).toISOString(),completedLocal:(late?addDays(date,1):date)+'T'+(late?'10:00':'15:30'),carryCount:late?1:0,originalDue:late?date:undefined,history:[],verify:'verified',verifiedBy:'MD'})});
    [3,5,7,8,4].forEach((p,j)=>{if((d+j)%6===0)return;const s=people[p];const date=addDays(td,-d);P('reports',date+'_'+sid[p],{date,staffId:sid[p],clinicId:ids[s[2]],dept:s[1],summary:'Completed assigned work for the day.',extra:'',pendingReason:'',issues:'',tomorrow:'',cases:null,hours:8,completedIds:[],completedTitles:['Assigned daily work'],pendingIds:[],pendingTitles:[],submittedAt:new Date(now-864e5*d).toISOString(),submittedLocal:date+'T'+(j===2?'21:40':'16:55'),late:j===2,reviewed:d>2,reviewedBy:'Mariam (sample)',adminVerified:d>4,adminBy:'MD',createdAt:new Date(now-864e5*d).toISOString()})})}
  [[0,'Waiting time','high','new','c1',7,5,'Waited 75 minutes past appointment time for aesthetic consultation.',30],[1,'Billing / pricing','medium','investigating','c2',8,9,'Charged for X-ray that patient says was included in package.',20],[2,'Insurance / claim','high','new','c1',5,9,'Claim rejected, patient asked to pay full amount at reception.',3],[3,'Staff behaviour','low','resolved','c3',13,9,'Felt rushed at front desk during check-in.',90]].forEach(([i,cat,sev,st,c,dp,h,desc,hrs])=>{
    P('complaints',uid()+'c',{patient:['Patient A (sample)','Patient B (sample)','Patient C (sample)','Patient D (sample)'][i],fileNo:String(10230+i),phone:'',channel:CHANNELS[i],clinicId:ids[c],dept:people[dp][1],category:cat,severity:sev,status:st,description:desc,handlerId:sid[h],resolution:st==='resolved'?'Apologised, coaching given to reception team.':'',informed:st==='resolved'?'yes':'no',createdAt:new Date(now-hrs*36e5).toISOString(),createdBy:'Hessa (sample)'})});
  [[2,'Leave','Annual leave 14–18 Nov','Family travel. Joseph will cover payroll queries.',null,'recommended','Cover arranged, recommended.',20,12],[6,'Purchase / expense','Restock dermal filler (10 syringes)','Stock will run out next week based on bookings.',1850,'pending','',1,4],[9,'Patient discount / refund','Refund for cancelled whitening session','Patient B complaint, session cancelled by clinic.',600,'pending','',0,2],[8,'Overtime','Weekend overtime for reception (2 staff)','Eid rush, extra walk-ins expected.',null,'approved','Recommended.',3,50]].forEach(([p,type,title,details,amount,st,mn,nb,hrs])=>{const s=people[p];
    P('requests',uid()+'r',{type,title,details,amount,neededBy:addDays(td,nb),staffId:sid[p],clinicId:ids[s[2]],dept:s[1],status:st,mgrNote:mn,mgrBy:mn?'Mariam (sample)':'',adminNote:st==='approved'?'Approved for this weekend only.':'',adminBy:st==='approved'?'MD':'',createdAt:new Date(now-hrs*36e5).toISOString()})});

async function clearSample(){const W=[];COLS.forEach(c=>Object.entries(S[c]).forEach(([id,x])=>{if(x.sample)W.push([c,id])}));
  if(UI.actingAs&&S.staff[UI.actingAs]?.sample){UI.actingAs='';saveUI()}if(S.clinics[UI.clinic]?.sample){UI.clinic='';saveUI()}
  toast('Removing sample data…');for(let i=0;i<W.length;i+=8){await Promise.all(W.slice(i,i+8).map(([c,id])=>del(c,id)))}toast('Sample data removed')}

/* ---------- events ---------- */
const pendingDel={};
function confirmBtn(b,fn){const k=b.dataset.act+b.dataset.id;if(pendingDel[k]){delete pendingDel[k];fn();return}pendingDel[k]=1;b.textContent='Click again to confirm';setTimeout(()=>{delete pendingDel[k];if(b.isConnected)b.textContent='Delete'},3500)}
const ACT={
  nav:d=>{UI.view=d.v;saveUI();render();window.scrollTo(0,0)},
  closeDlg:()=>dlg.close(),
  newTask:d=>{if(!clinicArr().length||!staffArr().length){toast('Add clinics and staff first.');return}taskForm(null,d.self&&me()?.name)},
  editTask:d=>taskForm(d.id),
  done:d=>{setStatus({id:d.id,...S.tasks[d.id]},'done');toast('Marked done')},
  start:d=>setStatus({id:d.id,...S.tasks[d.id]},'progress'),
  reopen:d=>setStatus({id:d.id,...S.tasks[d.id]},'todo'),
  carry:d=>{carryOver({id:d.id,...S.tasks[d.id]});toast('Moved to today')},
  carryAll:async()=>{const M=taskArr().filter(t=>isMissed(t)&&inClinic(t));for(const t of M)carryOver(t);toast(`${M.length} task${M.length===1?'':'s'} moved to today`)},
  gotoMissed:()=>{UI.tf.status='missed';UI.view='tasks';saveUI();render()},
  delTask:(d,b)=>confirmBtn(b,()=>{del('tasks',d.id);dlg.close();toast('Task deleted')}),
  reportForm:()=>reportForm(),
  viewReport:d=>viewReport(d.id),
  rDay:d=>{UI.rDate=addDays(UI.rDate||today(),+d.n);render()},
  newComplaint:()=>{if(!clinicArr().length){toast('Add a clinic first.');return}complaintForm()},
  editComplaint:d=>complaintForm(d.id),
  delComplaint:(d,b)=>confirmBtn(b,()=>{del('complaints',d.id);dlg.close();toast('Complaint deleted')}),
  cf:d=>{UI.cf.status=d.v;saveUI();render()},
  effBy:d=>{UI.effBy=d.v;saveUI();render()},
  effDays:d=>{UI.effDays=+d.v;saveUI();render()},
  clinicForm:d=>clinicForm(d.id),
  staffForm:d=>{if(!clinicArr().length){toast('Add a clinic first.');clinicForm();return}staffForm(d.id)},
  delClinic:(d,b)=>{if(staffArr().some(s=>s.clinicId===d.id)){toast('Move or delete this clinic’s staff first.');return}confirmBtn(b,()=>{del('clinics',d.id);dlg.close()})},
  delStaff:(d,b)=>confirmBtn(b,()=>{if(loginOf(d.id))callFn({action:'remove',staff_id:d.id}).then(loadProfiles).catch(e=>toast(e.message));del('staff',d.id);if(UI.actingAs===d.id){UI.actingAs='';saveUI()}dlg.close()}),
  verifyTask:d=>{const t=S.tasks[d.id];const vr=myRole()==='admin'?'MD':'Clinic manager';put('tasks',d.id,{...t,verify:'verified',verifiedBy:me()?.name||'MD',verifiedRole:vr,verifiedAt:new Date().toISOString(),history:[...(t.history||[]),{at:new Date().toISOString(),by:me()?.name||'MD',what:'Verified by '+vr}].slice(-20)});toast('Verified')},
  verifyAll:()=>{const L=toVerify();L.forEach(t=>ACT.verifyTask({id:t.id}));toast(`${L.length} tasks verified`)},
  returnTask:d=>returnForm(d.id),
  newRequest:()=>requestForm(),
  decide:d=>decideForm(d.id),
  rf:d=>{UI.rf=d.v;render()},
  loadSample:()=>loadSample(),
  signOut:()=>signOut(),
  createLogin:d=>loginForm(d.id,false),
  resetPw:d=>loginForm(d.id,true),
  ownPw:()=>ownPwForm(),
  removeLogin:(d,b)=>confirmBtn(b,()=>callFn({action:'remove',staff_id:d.id}).then(()=>{dlg.close();toast('Login removed');return loadProfiles().then(schedule)}).catch(e=>toast(e.message))),
  clearSample:(d,b)=>{b.dataset.id='all';confirmBtn(b,clearSample)},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b,e)}});
document.addEventListener('change',e=>{const k=e.target.dataset.change;if(!k)return;const v=e.target.value;
  if(k==='acting'){UI.actingAs=v;const s=S.staff[v];if(s&&s.role!=='admin')UI.clinic=s.clinicId;else if(!v)UI.clinic='';UI.view=s&&s.role==='staff'?'myday':UI.view}
  else if(k==='clinic')UI.clinic=v;else if(k==='actWho')UI.actWho=v;else if(k==='actDays')UI.actDays=+v;else if(k==='rDate')UI.rDate=v;else if(k.startsWith('tf.'))UI.tf[k.slice(3)]=v;
  saveUI();render()});
let qT;document.addEventListener('input',e=>{if(e.target.dataset.input!=='tf.q')return;UI.tf.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{saveUI();render();const el=document.getElementById('tf-q');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)});
setInterval(()=>{if(!dlg.open)schedule()},60000);
boot();
